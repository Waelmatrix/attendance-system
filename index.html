<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الحضور</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4001a">
<link rel="apple-touch-icon" href="icon.png">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
}
</script>

<style>

body{
    font-family:Tahoma;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.1);
    text-align:center;
    width:320px;
}

h2{
    margin-bottom:20px;
    color:#333;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:#0056b3;
}

#status{
    margin-top:20px;
    color:#555;
    font-size:14px;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="box">

<h2>تسجيل الحضور</h2>

<select id="attendanceType">

<option value="attendance">حضور</option>
<option value="leave">إجازة</option>
<option value="rest">بدل راحة</option>
<option value="mission">مأمورية</option>

</select>

<button onclick="sendLocation()">تسجيل</button>

<div id="status"></div>

</div>

<script>

function sendLocation(){

let type =
document.getElementById("attendanceType").value;

document.getElementById("status").innerHTML =
"جارى التنفيذ...";

/* =========================
   إجازة / مأمورية / بدل راحة
========================= */

if(
type === "leave" ||
type === "rest" ||
type === "mission"
){

let formURL =
"https://docs.google.com/forms/d/e/1FAIpQLSd5YCyFwOdjrJUIGWk7JsCTzV8lIhqvulKGR21ehL-p2IzQ6w/viewform";

window.location.href = formURL;

return;
}

/* =========================
   المواقع المسموح بها
========================= */

let locations = [

{
    name: "السنترال الرئيسي",
    lat: 25.447794,
    lng: 30.544412
},

{
    name: "سنترال باريس",
    lat: 24.674591,
    lng: 30.605435
},

{
    name: "سنترال المنيرة",
    lat: 25.617703,
    lng: 30.645818
},

{
    name: "فرع جديد",
    lat: 25.457426,
    lng: 30.536133
}

];

/* =========================
   GPS
========================= */

navigator.geolocation.getCurrentPosition(

function(position){

let lat = position.coords.latitude;
let lng = position.coords.longitude;

let allowed = false;
let nearestName = "";
let nearestDistance = Infinity;

/* =========================
   حساب أقرب موقع
========================= */

for(let i = 0; i < locations.length; i++){

let distance = getDistanceFromLatLonInM(
lat,
lng,
locations[i].lat,
locations[i].lng
);

if(distance < nearestDistance){
    nearestDistance = distance;
    nearestName = locations[i].name;
}

if(distance <= 300){
    allowed = true;
}

}

/* =========================
   عرض الحالة للمستخدم
========================= */

let statusText =
"📍 موقعك الحالي: " + nearestName +
"<br>📏 المسافة: " + Math.round(nearestDistance) + " متر";

if(!allowed){
statusText += "<br>❌ أنت خارج نطاق العمل";
document.getElementById("status").innerHTML = statusText;
return;
}else{
statusText += "<br>✅ داخل نطاق العمل";
}

document.getElementById("status").innerHTML = statusText;

/* =========================
   فتح الفورم
========================= */

let formURL =
"https://docs.google.com/forms/d/e/1FAIpQLSd5YCyFwOdjrJUIGWk7JsCTzV8lIhqvulKGR21ehL-p2IzQ6w/viewform";

setTimeout(()=>{
window.location.href = formURL;
}, 1500);

},

function(error){

if(error.code === 1){
document.getElementById("status").innerHTML =
"يجب السماح بالموقع GPS";
}else{
document.getElementById("status").innerHTML =
"حدث خطأ فى تحديد الموقع";
}

}

);

}

/* =========================
   حساب المسافة
========================= */

function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2){

let R = 6371;

let dLat = deg2rad(lat2-lat1);
let dLon = deg2rad(lon2-lon1);

let a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(deg2rad(lat1)) *
Math.cos(deg2rad(lat2)) *
Math.sin(dLon/2) *
Math.sin(dLon/2);

let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

return R * c * 1000;

}

function deg2rad(deg){
return deg * (Math.PI/180);
}

</script>

</body>
</html>
