<!DOCTYPE html>
<html lang="ar" dir="rtl">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#d4001a">

<link rel="apple-touch-icon" href="icon.png">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الحضور</title>

<style>

body{
    font-family:Tahoma;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.1);
    text-align:center;
    width:320px;
}

h2{
    margin-bottom:20px;
    color:#333;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:#0056b3;
}

#status{
    margin-top:20px;
    color:#555;
    font-size:14px;
}

</style>

</head>

<body>

<div class="box">

<h2>تسجيل الحضور</h2>

<button onclick="sendLocation()">
تسجيل الموقع
</button>

<div id="status"></div>

</div>

<script>

function sendLocation(){

document.getElementById("status").innerHTML =
"جارى تحديد الموقع...";

navigator.geolocation.getCurrentPosition(

function(position){

let lat = position.coords.latitude;
let lng = position.coords.longitude;

/* موقع الشركة */

let companyLat = 25.447794;
let companyLng = 30.544412;

/* حساب المسافة */

let distance = getDistanceFromLatLonInM(
lat,
lng,
companyLat,
companyLng
);

/* السماح داخل 200 متر */

if(distance > 200){

document.getElementById("status").innerHTML =
"أنت خارج نطاق الشركة";

return;

}

/* رابط الفورم */

let formURL =
"https://docs.google.com/forms/d/e/1FAIpQLSd5YCyFwOdjrJUIGWk7JsCTzV8lIhqvulKGR21ehL-p2IzQ6w/viewform";

window.location.href = formURL;

},

function(){

document.getElementById("status").innerHTML =
"يجب السماح بالموقع GPS";

}

);

}

/* حساب المسافة */

function getDistanceFromLatLonInM(
lat1,
lon1,
lat2,
lon2
){

let R = 6371;

let dLat = deg2rad(lat2-lat1);

let dLon = deg2rad(lon2-lon1);

let a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(deg2rad(lat1)) *
Math.cos(deg2rad(lat2)) *
Math.sin(dLon/2) *
Math.sin(dLon/2);

let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

let d = R * c;

return d * 1000;

}

function deg2rad(deg){

return deg * (Math.PI/180);

}

</script>

</body>
</html>
